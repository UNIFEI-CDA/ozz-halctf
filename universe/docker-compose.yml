# Ozz Universe — Synthetic HALctf Environment
# Rede isolada com 4 targets vulneráveis e 5 flags
#
# Targets:
#   10.0.0.10 — Web (LFI, SQLi)        → flag{web_master}
#   10.0.0.20 — SSH/Samba (weak creds) → flag{ssh_ghost}
#   10.0.0.30 — Flask API (SSTI, JWT)   → flag{api_breaker}
#   10.0.0.40 — MySQL (interno)         → flag{deep_vault} + flag{halctf_king}
#
# Start: docker compose up --build
# Stop:  docker compose down -v

version: "3.8"

networks:
  ctf-net:
    driver: bridge
    internal: true   # ← BLOCKS all external/internet access
    ipam:
      config:
        - subnet: 10.0.0.0/24

services:
  # === TARGET-01: Web Vulnerável (LFI + SQLi) ===
  target-01:
    build: ./target-01
    container_name: target-01
    hostname: target-01
    networks:
      ctf-net:
        ipv4_address: 10.0.0.10

  # === TARGET-02: SSH + Samba (Credenciais Fracas) ===
  target-02:
    build: ./target-02
    container_name: target-02
    hostname: target-02
    networks:
      ctf-net:
        ipv4_address: 10.0.0.20

  # === TARGET-03: Flask API (SSTI + JWT Bypass) ===
  target-03:
    build: ./target-03
    container_name: target-03
    hostname: target-03
    networks:
      ctf-net:
        ipv4_address: 10.0.0.30

  # === TARGET-04: MySQL Interno (Apenas via rede interna) ===
  target-04:
    build: ./target-04
    container_name: target-04
    hostname: target-04
    networks:
      ctf-net:
        ipv4_address: 10.0.0.40
    environment:
      - MYSQL_ROOT_PASSWORD=MySQL_R00t_2026!

  # === SCOREBOARD ===
  scoreboard:
    build: ./scoreboard
    container_name: scoreboard
    hostname: scoreboard
    networks:
      ctf-net:
        ipv4_address: 10.0.0.200
    ports:
      - "9090:9090"
