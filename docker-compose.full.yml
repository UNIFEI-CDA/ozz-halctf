# Ozz — Full Stack: Universe + Agent + LLM
# Isolated CTF network — no internet access
#
# Usage:
#   docker compose -f docker-compose.full.yml up --build

version: "3.8"

networks:
  ctf-net:
    driver: bridge
    internal: true   # ← BLOCKS all external/internet access
    ipam:
      config:
        - subnet: 10.0.0.0/24

services:
  # === TARGETS ===
  target-01:
    build: ./universe/target-01
    container_name: target-01
    hostname: target-01
    networks:
      ctf-net:
        ipv4_address: 10.0.0.10

  target-02:
    build: ./universe/target-02
    container_name: target-02
    hostname: target-02
    networks:
      ctf-net:
        ipv4_address: 10.0.0.20

  target-03:
    build: ./universe/target-03
    container_name: target-03
    hostname: target-03
    networks:
      ctf-net:
        ipv4_address: 10.0.0.30

  target-04:
    build: ./universe/target-04
    container_name: target-04
    hostname: target-04
    networks:
      ctf-net:
        ipv4_address: 10.0.0.40
    environment:
      - MYSQL_ROOT_PASSWORD=MySQL_R00t_2026!

  # === SCOREBOARD ===
  scoreboard:
    build: ./universe/scoreboard
    container_name: scoreboard
    hostname: scoreboard
    networks:
      ctf-net:
        ipv4_address: 10.0.0.200
    ports:
      - "9090:9090"

  # === OZZ AGENT ===
  ozz:
    build: .
    container_name: ozz-agent
    profiles:
      - agent
    networks:
      ctf-net:
        ipv4_address: 10.0.0.100
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TARGETS=10.0.0.10,10.0.0.20,10.0.0.30,10.0.0.40
      - MODEL_NAME=Qwen/Qwen2.5-Coder-7B-Instruct
      - GPU_MEMORY_UTILIZATION=0.85
      - MAX_MODEL_LEN=8192
      - SCOREBOARD_URL=http://10.0.0.200:9090
    volumes:
      - ozz-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - target-01
      - target-02
      - target-03
      - target-04
      - scoreboard

volumes:
  ozz-models:
